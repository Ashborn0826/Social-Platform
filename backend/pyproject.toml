[project]
name = "social-platform-backend"
version = "0.1.0"
description = "Social platform backend (Phase 1+: FastAPI + Postgres + Redis + S3-compatible storage)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pydantic>=2.0",
    "pydantic[email]>=2.0",
    "pydantic-settings>=2.0",
    "redis>=5.0",
    "bcrypt>=4.0,<5.0",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
    # Phase 2+
    "boto3>=1.34",
    "pillow>=10.0",
    "python-multipart>=0.0.9",
    "arq>=0.25",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "aiosqlite>=0.20",
    "fakeredis>=2.20",
    "moto[s3]>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"